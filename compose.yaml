services:
  postgres:
    image: pgvector/pgvector:pg18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: aero_diary
      POSTGRES_USER: aero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aero-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aero-diary-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aero -d aero_diary"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  aero-diary-postgres:
